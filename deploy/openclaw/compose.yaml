services:
  brain-gateway:
    build:
      context: ../..
      dockerfile: deploy/openclaw/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    working_dir: /app
    command:
      - pnpm
      - --filter
      - "@second-brain/openclaw-adapter"
      - exec
      - openclaw
      - gateway
      - --bind
      - lan
      - --port
      - "18789"
    environment:
      HOME: /home/node
      BRAIN_ROOT: /brain
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openai/gpt-5.4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - ../..:/brain
      - ./openclaw.json:/etc/openclaw/openclaw.json:ro
      - openclaw-runtime:/home/node/.openclaw
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  openclaw-runtime:
