name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-cli:
    name: Core and CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.3", "24.15.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm brain doctor
      - run: pnpm schemas:generate
      - run: git diff --exit-code -- schemas

  openclaw-adapter:
    name: OpenClaw adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run adapters/openclaw/test
      - run: pnpm --filter @second-brain/openclaw-adapter build

  openclaw-container:
    name: OpenClaw container
    runs-on: ubuntu-latest
    env:
      OPENCLAW_GATEWAY_TOKEN: ci-only-not-a-real-secret
      OPENCLAW_GATEWAY_PORT: "18789"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/openclaw/compose.yaml config
      - run: docker compose -f deploy/openclaw/compose.yaml build
